<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Ajab Flour</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1B5E20, #2E7D32);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo i {
            font-size: 50px;
            color: #2E7D32;
            margin-bottom: 10px;
        }
        
        h2 {
            color: #2E7D32;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #2E7D32;
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #2E7D32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        
        .btn-login:hover {
            background: #1B5E20;
        }
        
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert-error {
            background: #FFEBEE;
            color: #C62828;
            border: 1px solid #FFCDD2;
        }
        
        .demo-credentials {
            background: #E8F5E9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .demo-credentials h4 {
            color: #2E7D32;
            margin-bottom: 10px;
        }
        
        .demo-credentials p {
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #2E7D32;
            text-decoration: none;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-wheat"></i>
            <h2>Ajab Flour Admin</h2>
        </div>
        
        <div class="alert" id="alertMessage"></div>
        
        <form id="adminLoginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="admin@ajabflour.co.ke">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Login to Admin Dashboard
            </button>
        </form>
        
        <div class="demo-credentials">
            <h4>Demo Credentials:</h4>
            <p><strong>Admin:</strong> admin@ajabflour.co.ke / admin123</p>
            <p><strong>Sales:</strong> sales@ajabflour.co.ke / sales123</p>
        </div>
        
        <div class="back-link">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Main Site</a>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://ajab-flour-hub.onrender.com';
        
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alert = document.getElementById('alertMessage');
            
            // Clear previous alerts
            alert.style.display = 'none';
            alert.className = 'alert';
            
            try {
                // ✅ FIXED: Added /api/ prefix
                const response = await fetch(`${API_BASE_URL}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Check if user has admin/sales role
                    if (!['admin', 'sales'].includes(data.user.role)) {
                        showAlert('Access denied. Admin privileges required.', 'error');
                        return;
                    }
                    
                    // Save user data and token
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    localStorage.setItem('token', data.token);
                    
                    // Redirect to admin dashboard
                    window.location.href = 'admin.html';
                    
                } else {
                    showAlert(data.error || 'Login failed', 'error');
                }
                
            } catch (error) {
                console.error('Login error:', error);
                showAlert('Network error. Please check backend is running.', 'error');
            }
        });
        
        function showAlert(message, type = 'error') {
            const alert = document.getElementById('alertMessage');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }
        
        // Auto-fill demo credentials for testing
        function fillDemoCredentials(role = 'admin') {
            if (role === 'admin') {
                document.getElementById('email').value = 'admin@ajabflour.co.ke';
                document.getElementById('password').value = 'admin123';
            } else {
                document.getElementById('email').value = 'sales@ajabflour.co.ke';
                document.getElementById('password').value = 'sales123';
            }
        }
        
        // For easy testing, uncomment one of these:
        // fillDemoCredentials('admin'); // Auto-fill admin credentials
        // fillDemoCredentials('sales'); // Auto-fill sales credentials
    </script>
</body>
</html>
