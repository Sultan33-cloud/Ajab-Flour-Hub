<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation - Ajab Flour</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <img src="https://img.icons8.com/color/96/000000/wheat.png" alt="Ajab Flour Logo" class="logo-img">
                <span class="logo-text">AJAB LTD</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#products">Products</a></li>
                <li><a href="index.html#bulk-order">Bulk Order</a></li>
                <li><button class="btn btn-cart" id="cartBtn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </button></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="margin-top: 100px; margin-bottom: 50px; text-align: center;">
        <div style="background: linear-gradient(135deg, #2E7D32, #4CAF50); color: white; padding: 60px 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
            <i class="fas fa-check-circle" style="font-size: 80px; margin-bottom: 20px;"></i>
            <h1 style="color: white; font-size: 2.5rem;">Order Confirmed!</h1>
            <p style="color: rgba(255,255,255,0.9); font-size: 1.2rem; margin-bottom: 30px;">Thank you for your order. We'll process it shortly.</p>
            <p style="color: rgba(255,255,255,0.9);">Order Number: <strong id="orderNumber">Loading...</strong></p>
            <p style="color: rgba(255,255,255,0.9); margin-bottom: 40px;">A confirmation email has been sent to your email address.</p>
            <div style="display: flex; gap: 20px; justify-content: center;">
                <a href="index.html" class="btn btn-primary">Continue Shopping</a>
                <a href="#" onclick="window.print()" class="btn btn-secondary">Print Receipt</a>
            </div>
        </div>
    </div>

    <script>
        // Get order number from URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');
        document.getElementById('orderNumber').textContent = orderId || 'ORD-2024-001';
    </script>
</body>
</html>
